[project]
name = "lab-wk3"
version = "0.1.0"
description = "Week 3 lab + assignment: a build-fixer agent behind a human approval gate, plus test-impact selection and single-failure-class remediation"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40",
    "flake8>=7.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "src/lab", "src/assignment"]
