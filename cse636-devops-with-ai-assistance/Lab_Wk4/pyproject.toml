[project]
name = "lab-wk4"
version = "0.1.0"
description = "Week 4 lab + assignment: Prophet time-series forecasting for Kubernetes autoscaling"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "prophet>=1.4.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
