[project]
name = "lab-wk6"
version = "0.1.0"
description = "Week 6 lab + assignment: a gated, ReAct incident-triage agent over MCP tools, plus a self-healing microservice agent with blast-radius controls"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40",
    "mcp>=1.2,<2.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
