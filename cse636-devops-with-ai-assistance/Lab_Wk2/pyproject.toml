[project]
name = "lab-wk2"
version = "0.1.0"
description = "Week 2 lab + assignment: an AI code-review pipeline and an MCP server exposing build status, simulated locally without Docker/Jenkins"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40",
    "mcp>=1.2,<2.0",
    "flake8>=7.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
