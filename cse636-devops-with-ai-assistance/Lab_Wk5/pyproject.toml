[project]
name = "lab-wk5"
version = "0.1.0"
description = "Week 5 lab + assignment: anomaly detection, alert grouping, and agentic RCA with OTel GenAI instrumentation"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-api>=1.27",
    "anthropic>=0.40",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
