name: CI

# Builds all three services and runs an end-to-end smoke test of the full
# vote -> redis -> worker -> postgres -> result pipeline.
#
# Deliberately does NOT run `npm test` in result/: package.json's test script is
# the npm-init stub (`echo "Error: no test specified" && exit 1`), so calling it
# would fail every run. The repo's only real test harness is
# result/docker-compose.test.yml, which drives result/tests/tests.sh -- that
# script needs phantomjs (abandoned in 2018, no longer installable) and pins
# postgres:9.4 (EOL Nov 2020), so it cannot run on a current runner either.
# The e2e job below is the replacement: it asserts the vote actually lands in
# Postgres, which is the behaviour those tests were checking.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: example-voting-app-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Byte-compile the Flask app
        run: python -m compileall -q vote/

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check the result server
        run: node --check result/server.js

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the worker
        working-directory: worker
        run: dotnet build --configuration Release

  e2e:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Cast a vote
        run: |
          curl -fsS -X POST --data 'vote=a' http://localhost:8080/ -o /dev/null
          echo "vote submitted"

      - name: Wait for the worker to persist it
        run: |
          for i in $(seq 1 30); do
            rows=$(docker compose exec -T db \
              psql -U postgres -tAc "SELECT COUNT(*) FROM votes" 2>/dev/null || echo 0)
            rows=$(echo "$rows" | tr -d '[:space:]')
            echo "attempt $i: votes table has '${rows}' row(s)"
            if [ "$rows" = "1" ]; then
              echo "PASS: the vote reached Postgres via redis + worker"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: no vote row after 60s"
          exit 1

      - name: Check the result service serves its page
        run: curl -fsS http://localhost:8081/ | grep -q 'Cats' && echo "PASS: result page served"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
